<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AgentOS — автономная компания</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>AgentOS</h1>
    <p>Автономная компания, работающая без людей</p>
</header>

<section id="status">
    <h2>Статус системы</h2>
    <div id="system-status">Загрузка...</div>
</section>

<section id="features">
    <h2>Что делает система</h2>
    <ul>
        <li>Принимает письма</li>
        <li>Классифицирует задачи</li>
        <li>Выполняет работу</li>
        <li>Отвечает клиентам</li>
        <li>Анализирует данные</li>
        <li>Работает 24/7</li>
    </ul>
</section>

<section id="contact">
    <h2>Оставить заявку</h2>
    <input id="email" type="email" placeholder="Ваш email">
    <textarea id="message" placeholder="Сообщение"></textarea>
    <button onclick="sendRequest()">Отправить</button>
    <div id="response"></div>
</section>

<footer>
    <p>© 2026 AgentOS</p>
</footer>

<script src="script.js"></script>
</body>
</html>
